name: Qualidade
on:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Prepare PDF dependency lock
        run: |
          npm install --package-lock-only --ignore-scripts
          node -e "console.log('PDF_LOCK_BEGIN:'+Buffer.from(require('fs').readFileSync('package-lock.json')).toString('base64')+':PDF_LOCK_END')"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          for file in pdf-test-results/*.pdf; do pdftotext -layout "$file" "${file%.pdf}.txt"; done
          node tests/pdf-validation.mjs
          pdftoppm -f 1 -singlefile -scale-to 1200 -png pdf-test-results/relatorio.pdf pdf-test-results/relatorio-preview
          node -e "console.log('PDF_PREVIEW_BEGIN:'+require('fs').readFileSync('pdf-test-results/relatorio-preview.png').toString('base64')+':PDF_PREVIEW_END')"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          VITE_DEMO_MODE: 'true'
          BRAND_VISUAL_REVIEW: ${{ github.ref == 'refs/heads/codex/official-brand' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-and-traces
          path: |
            test-results/
            pdf-test-results/
          retention-days: 7
